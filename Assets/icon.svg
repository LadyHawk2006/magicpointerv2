<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Soft Ambient Outer Blue Glow -->
    <filter id="cursorGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur" />
      <feFlood flood-color="#2563eb" flood-opacity="0.6" result="glowColor" />
      <feComposite in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Sparkle Outer Glow -->
    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cursor Body Linear Gradient -->
    <linearGradient id="cursorGradient" x1="0.1" y1="0.9" x2="0.85" y2="0.15">
      <stop offset="0%" stop-color="#02040a" />
      <stop offset="25%" stop-color="#081838" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="85%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Sparkle Star Gradient -->
    <linearGradient id="sparkleGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Mathematically Symmetrical Cursor Pointer -->
  <g filter="url(#cursorGlow)" transform="translate(232, 268) rotate(-28)">
    <path d="M 0 -138
             C 14 -138, 26 -124, 38 -98
             L 94 34
             C 108 64, 96 95, 68 96
             C 52 97, 36 82, 22 66
             C 12 54, 5 44, 0 44
             C -5 44, -12 54, -22 66
             C -36 82, -52 97, -68 96
             C -96 95, -108 64, -94 34
             L -38 -98
             C -26 -124, -14 -138, 0 -138 Z" fill="url(#cursorGradient)" />
  </g>

  <!-- 4-Pointed Sparkle Star -->
  <g filter="url(#sparkleGlow)">
    <path d="M 326 82
             C 326 106 339 119 363 119
             C 339 119 326 132 326 156
             C 326 132 313 119 289 119
             C 313 119 326 106 326 82 Z" fill="url(#sparkleGradient)" />
  </g>
</svg>