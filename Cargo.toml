[package]
name = "magicpointerv2"
version = "0.1.0"
edition = "2024"
default-run = "magicpointerv2"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
hyprland = "0.4.0-beta.3"
libwayshot = "0.5"
gtk4 = "0.11.5"
gtk4-layer-shell = "0.8.1"
reqwest = { version = "0.13.5", features = ["json", "stream", "form"] }
futures-util = "0.3"
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23.1"
arboard = { version = "3.4", features = ["wayland-data-control"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
pulldown-cmark = "0.13"
